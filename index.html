<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <link rel="stylesheet" href="styles.css" />
  <title>Cidade Dorme</title>
</head>
<body>
  <div id="start-screen" role="main" aria-label="Tela de início">
    <img id="bg" src="/F6F81CDC-E9F7-4285-A393-96E9AD36C9AB.png" alt="" aria-hidden="true" />
    <div id="overlay">
      <div id="logo-area" aria-hidden="true"></div>

      <div id="controls">
        <button class="btn primary" id="nameBtn">
          <span>Nome do Jogador</span>
        </button>
        <button class="btn success" id="createRoomBtn">
          <span>Criar Sala</span>
        </button>
        <button class="btn" id="joinRoomBtn">
          <span>Entrar na sala</span>
        </button>
      </div>

      <div id="footer">
        <button class="icon-btn" id="muteBtn" aria-pressed="false" title="Mudo">🔊</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
